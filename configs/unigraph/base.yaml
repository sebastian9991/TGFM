MetaArguments:
  log_file_path: "unigraph_ogb_pretraining.log"
  node_file: ""
  edge_file: ""
  root_dir: "ogb_100m/"
  is_scratch_location: true
  global_seed: 42

ExperimentArguments:
  exp_args:
    Unigraph:
      model_args:
        model: "Unigraph"
        num_layers: 3
        num_neighbors: [4, 2, 1]
        batch_size: 16
        dropout: 0.2
        lr: 2.0e-5
        weight_decay: 0.001
        device: 0
      data_args:
        task_name: "pre-training"
