program: tgfm/experiments/legtjepa/main.py
method: random
entity: reihaneh-rabbany
project: legtjepa-pretrain     # otherwise wandb auto-names and ignores yours
metric:
  name: eval/zeroshot_macro
  goal: maximize

parameters:
  # ---- objective arm ----
  # Pinned, not swept: the lr and lambda optima sit in different places for the
  # two alignment terms, so a shared search would spend most of its samples off
  # optimum for one arm. Run this against random_large_sweep.yaml at matched
  # budget. Pinning here (rather than only in the yaml) puts it in wandb's run
  # config, so the two sweeps are filterable on one axis.
  align_objective:
    value: volume

  # ---- optimization ----
  lr:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 2.0e-2          # d/dcos(1 - cos^2) = -2cos with |cos| = O(d^-1/2) at
                         # init, plus 1/||z|| from the normalization: the
                         # alignment gradient starts well below the MSE arm's,
                         # so the useful range shifts up. GPS may still diverge
                         # below this ceiling.
  weight_decay:
    distribution: log_uniform_values
    min: 1.0e-6
    max: 1.0e-2
  warmup_steps:
    values: [50, 100, 200]   # cos = 0 is a stationary point of 1 - cos^2, so
                             # reaching peak lr sooner helps here, not later
  batch_size:
    values: [450, 900, 1800] # per rank; also rescales steps/epoch and SIGReg's batch

  # ---- objective ----
  # det G is in [0, 1] while the MSE term is O(embed_dim), so LeVLJEPA App. F's
  # [0.005, 0.04] would leave SIGReg roughly 100x heavier relative to alignment
  # than in the MSE arm. Range dropped two orders, upper end kept overlapping
  # so the sweep can still reach the App. F region if it wants it.
  lambda_graph:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  lambda_text:
    distribution: log_uniform_values
    min: 1.0e-4
    max: 1.0e-2
  sigreg_num_slices:
    values: [128, 256, 512]

  # ---- predictors / projections ----
  predictor_depth:
    values: [2, 3, 4]
  predictor_hidden_dim:
    values: [1024, 2048, 4096]
  predictor_dropout:
    distribution: uniform
    min: 0.0
    max: 0.2
  proj_hidden_dim:
    values: [1024, 2048]
  proj_dropout:
    distribution: uniform
    min: 0.0
    max: 0.2
  embed_dim:
    values: [256, 384, 768]

  # ---- graph encoder ----
  graph_num_layers:
    values: [6, 8, 12]
  graph_hidden_dim:
    values: [512, 768, 1024]
  graph_pe_dim:
    values: [8, 16, 32]
  attn_dropout:
    values: [0.0, 0.1]

  # ---- augmentation: always on, 0.0 encodes "off" ----
  # A boolean flag plus dependent rates wastes bayes samples on inactive
  # dimensions; folding "off" into the rate keeps the space continuous.
  graph_aug:
    value: true
  aug_feat_drop:
    distribution: uniform
    min: 0.0
    max: 0.5             # GraphCLIP: 0.3
  aug_edge_drop:
    distribution: uniform
    min: 0.0
    max: 0.4             # GraphCLIP: 0.2

  epochs:
    value: 10

early_terminate:
  type: hyperband
  min_iter: 1
  eta: 3

command:
  - ${env}
  - bash
  - bash_scripts/sweeps/volume.sh
